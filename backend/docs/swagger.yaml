basePath: /
definitions:
  domain.AdminStats:
    properties:
      active_exams:
        type: integer
      total_creators:
        type: integer
      total_forms:
        type: integer
      total_responses:
        type: integer
      total_users:
        type: integer
    type: object
  domain.FormAnalytics:
    properties:
      average_score:
        type: number
      highest_score:
        type: number
      lowest_score:
        type: number
      question_breakdown:
        additionalProperties:
          $ref: '#/definitions/domain.QuestionAnalytics'
        type: object
      total_responses:
        type: integer
    type: object
  domain.FormSettings:
    properties:
      auto_active_days:
        type: integer
      duration_minutes:
        type: integer
      end_time:
        type: string
      form_id:
        type: string
      id:
        type: string
      is_active_immediately:
        type: boolean
      is_one_time_submission:
        type: boolean
      randomize_options:
        type: boolean
      randomize_questions:
        type: boolean
      start_time:
        type: string
    type: object
  domain.FormStatus:
    enum:
    - DRAFT
    - ACTIVE
    - CLOSED
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusActive
    - StatusClosed
  domain.FormType:
    enum:
    - SURVEY
    - EXAM
    type: string
    x-enum-varnames:
    - TypeSurvey
    - TypeExam
  domain.QuestionAnalytics:
    properties:
      accuracy_rate:
        type: number
      correct_count:
        type: integer
      option_counts:
        additionalProperties:
          type: integer
        description: Option ID -> count
        type: object
      question_id:
        type: string
      question_text:
        type: string
      total_answered:
        type: integer
    type: object
  domain.QuestionType:
    enum:
    - SHORT_TEXT
    - LONG_TEXT
    - MULTIPLE_CHOICE
    - CHECKBOXES
    - DROPDOWN
    - RATING
    - YES_NO
    - MATH
    - CODE
    - IMAGE
    type: string
    x-enum-varnames:
    - TypeShortText
    - TypeLongText
    - TypeMultipleChoice
    - TypeCheckboxes
    - TypeDropdown
    - TypeRating
    - TypeYesNo
    - TypeMath
    - TypeCode
    - TypeImage
  domain.UserRole:
    enum:
    - superadmin
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleSuperAdmin
    - RoleAdmin
    - RoleUser
  dto.AnswerDetailDTO:
    properties:
      answer_text:
        type: string
      id:
        type: string
      is_correct:
        type: boolean
      points_earned:
        type: number
      question_id:
        type: string
      question_text:
        type: string
      score_given:
        type: number
      selected_option_id:
        type: string
      selected_option_text:
        type: string
    type: object
  dto.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.CreateFormRequest:
    properties:
      custom_url:
        type: string
      description:
        type: string
      is_template:
        type: boolean
      title:
        maxLength: 255
        minLength: 2
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.FormType'
        enum:
        - SURVEY
        - EXAM
    required:
    - title
    - type
    type: object
  dto.CreateOptionRequest:
    properties:
      is_correct:
        type: boolean
      option_text:
        type: string
      order_index:
        type: integer
    required:
    - option_text
    type: object
  dto.CreateQuestionRequest:
    properties:
      code_language:
        type: string
      img_url:
        type: string
      is_auto_scored:
        type: boolean
      is_required:
        type: boolean
      options:
        items:
          $ref: '#/definitions/dto.CreateOptionRequest'
        type: array
      order_index:
        type: integer
      points:
        minimum: 0
        type: integer
      question_text:
        type: string
      question_type:
        $ref: '#/definitions/domain.QuestionType'
    required:
    - question_text
    - question_type
    type: object
  dto.CreatorResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.FormResponseDTO:
    properties:
      created_at:
        type: string
      custom_url:
        type: string
      description:
        type: string
      form_settings:
        $ref: '#/definitions/domain.FormSettings'
      id:
        type: string
      is_template:
        type: boolean
      questions:
        items:
          $ref: '#/definitions/dto.QuestionDTO'
        type: array
      response_count:
        type: integer
      status:
        $ref: '#/definitions/domain.FormStatus'
      title:
        type: string
      type:
        $ref: '#/definitions/domain.FormType'
      user_id:
        type: string
    type: object
  dto.GradeResponseRequest:
    properties:
      total_score:
        minimum: 0
        type: number
    type: object
  dto.ImportStudentsRequest:
    properties:
      students:
        items:
          $ref: '#/definitions/dto.RegisterRequest'
        type: array
    required:
    - students
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.OptionDTO:
    properties:
      id:
        type: string
      is_correct:
        type: boolean
      option_text:
        type: string
      order_index:
        type: integer
      question_id:
        type: string
    type: object
  dto.PublicFormDTO:
    properties:
      custom_url:
        type: string
      description:
        type: string
      form_settings:
        $ref: '#/definitions/dto.PublicFormSettings'
      id:
        type: string
      is_template:
        type: boolean
      questions:
        items:
          $ref: '#/definitions/dto.PublicQuestionDTO'
        type: array
      status:
        $ref: '#/definitions/domain.FormStatus'
      title:
        type: string
      type:
        $ref: '#/definitions/domain.FormType'
    type: object
  dto.PublicFormSettings:
    properties:
      auto_active_days:
        type: integer
      duration_minutes:
        type: integer
      end_time:
        type: string
      is_active_immediately:
        type: boolean
      is_one_time_submission:
        type: boolean
      randomize_options:
        type: boolean
      randomize_questions:
        type: boolean
      start_time:
        type: string
    type: object
  dto.PublicOptionDTO:
    properties:
      id:
        type: string
      option_text:
        type: string
      order_index:
        type: integer
    type: object
  dto.PublicQuestionDTO:
    properties:
      code_language:
        type: string
      id:
        type: string
      img_url:
        type: string
      is_auto_scored:
        type: boolean
      is_required:
        type: boolean
      options:
        items:
          $ref: '#/definitions/dto.PublicOptionDTO'
        type: array
      order_index:
        type: integer
      points:
        type: integer
      question_text:
        type: string
      question_type:
        $ref: '#/definitions/domain.QuestionType'
    type: object
  dto.QuestionDTO:
    properties:
      code_language:
        type: string
      form_id:
        type: string
      id:
        type: string
      img_url:
        type: string
      is_auto_scored:
        type: boolean
      is_required:
        type: boolean
      options:
        items:
          $ref: '#/definitions/dto.OptionDTO'
        type: array
      order_index:
        type: integer
      points:
        type: integer
      question_text:
        type: string
      question_type:
        $ref: '#/definitions/domain.QuestionType'
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.ResendOTPRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  dto.ResponseDetailDTO:
    properties:
      answers:
        items:
          $ref: '#/definitions/dto.AnswerDetailDTO'
        type: array
      form_id:
        type: string
      id:
        type: string
      is_auto_submitted:
        type: boolean
      respondent_email:
        type: string
      submitted_at:
        type: string
      total_score:
        type: number
    type: object
  dto.SubmitAnswerDetail:
    properties:
      answer_text:
        type: string
      question_id:
        type: string
      selected_option_id:
        type: string
    required:
    - question_id
    type: object
  dto.SubmitFormRequest:
    properties:
      answers:
        items:
          $ref: '#/definitions/dto.SubmitAnswerDetail'
        type: array
      is_auto_submitted:
        type: boolean
      passcode:
        type: string
      respondent_email:
        type: string
    required:
    - answers
    - respondent_email
    type: object
  dto.SubmitResponseResult:
    properties:
      is_auto_submitted:
        type: boolean
      message:
        type: string
      response_id:
        type: string
      submitted_at:
        type: string
      total_score:
        type: number
    type: object
  dto.UpdateCreatorStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  dto.UpdateFormRequest:
    properties:
      custom_url:
        type: string
      description:
        type: string
      is_template:
        type: boolean
      status:
        allOf:
        - $ref: '#/definitions/domain.FormStatus'
        enum:
        - DRAFT
        - ACTIVE
        - CLOSED
      title:
        maxLength: 255
        minLength: 2
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.FormType'
        enum:
        - SURVEY
        - EXAM
    required:
    - status
    - title
    - type
    type: object
  dto.UpdateFormSettingsRequest:
    properties:
      auto_active_days:
        type: integer
      duration_minutes:
        type: integer
      end_time:
        type: string
      is_active_immediately:
        type: boolean
      is_one_time_submission:
        type: boolean
      randomize_options:
        type: boolean
      randomize_questions:
        type: boolean
      start_time:
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  dto.UpdateQuestionRequest:
    properties:
      code_language:
        type: string
      img_url:
        type: string
      is_auto_scored:
        type: boolean
      is_required:
        type: boolean
      options:
        items:
          $ref: '#/definitions/dto.CreateOptionRequest'
        type: array
      order_index:
        type: integer
      points:
        minimum: 0
        type: integer
      question_text:
        type: string
      question_type:
        $ref: '#/definitions/domain.QuestionType'
    required:
    - question_text
    - question_type
    type: object
  dto.UploadImageResponse:
    properties:
      img_url:
        type: string
    type: object
  dto.UserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
    type: object
  dto.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp_code:
        type: string
    required:
    - email
    - otp_code
    type: object
  response.APIResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@hidocs.id
    name: HiDocs Support
  description: High-performance backend API for HiDocs Form & Exam Maker application
    using Golang and Domain-Driven Design (DDD).
  termsOfService: http://swagger.io/terms/
  title: HiDocs Backend API (Form & Exam Maker)
  version: "1.0"
paths:
  /api/v1/admin/creators:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CreatorResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List form creators/users
      tags:
      - Admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Create Creator Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create a new form creator account
      tags:
      - Admin
  /api/v1/admin/creators/{creator_id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: Creator ID
        in: path
        name: creator_id
        required: true
        type: string
      - description: Status Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCreatorStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update creator active/inactive status
      tags:
      - Admin
  /api/v1/admin/dashboard/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.AdminStats'
              type: object
      security:
      - BearerAuth: []
      summary: Get admin dashboard global statistics
      tags:
      - Admin
  /api/v1/admin/forms:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.FormResponseDTO'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List all system forms
      tags:
      - Admin
  /api/v1/admin/forms/{form_id}:
    delete:
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete form as admin
      tags:
      - Admin
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Generate password reset token
      parameters:
      - description: Forgot Password Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Request password reset
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Login user
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account. Generates a 6-digit OTP stored in
        Redis for 180 seconds.
      parameters:
      - description: Register Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Register user & send 6-digit OTP code to email
      tags:
      - Auth
  /api/v1/auth/resend-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: Resend OTP Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Resend 6-digit OTP code
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using token
      parameters:
      - description: Reset Password Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Reset password
      tags:
      - Auth
  /api/v1/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Validate 6-digit OTP code stored in Redis and return JWT Token
      parameters:
      - description: Verify OTP Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Verify OTP code and activate registration
      tags:
      - Auth
  /api/v1/forms:
    get:
      parameters:
      - description: Filter by status (DRAFT, ACTIVE, CLOSED)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.FormResponseDTO'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List user forms ('My Forms')
      tags:
      - Forms
    post:
      consumes:
      - application/json
      parameters:
      - description: Create Form Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateFormRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.FormResponseDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Create a new form
      tags:
      - Forms
  /api/v1/forms/{form_id}:
    delete:
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a form
      tags:
      - Forms
    get:
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.FormResponseDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Get form details
      tags:
      - Forms
    put:
      consumes:
      - application/json
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      - description: Update Form Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateFormRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.FormResponseDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Update form details
      tags:
      - Forms
  /api/v1/forms/{form_id}/analytics:
    get:
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.FormAnalytics'
              type: object
      security:
      - BearerAuth: []
      summary: Get real-time analytics for charts (Pie Chart score distribution, Question
        accuracy bar charts)
      tags:
      - Analytics
  /api/v1/forms/{form_id}/export:
    get:
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      - description: 'Export format (''xlsx'' or ''csv'', default: ''xlsx'')'
        in: query
        name: format
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Export form responses to Excel or CSV
      tags:
      - Responses
  /api/v1/forms/{form_id}/questions:
    get:
      parameters:
      - description: Form ID
        in: path
        name: form_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.QuestionDTO'
                  type: array
