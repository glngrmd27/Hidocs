org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation (fixes cache corruption on Windows)
kotlin.incremental=false
# Disable Kotlin daemon (prevents file-lock crashes on Windows)
kotlin.compiler.execution.strategy=in-process
# Use parallel builds
org.gradle.parallel=true
org.gradle.caching=false
